name: build

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  jar:
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest ]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Derle (Linux)
        if: runner.os != 'Windows'
        run: ./build.sh
      - name: Derle (Windows)
        if: runner.os == 'Windows'
        run: .\build.bat
      - uses: actions/upload-artifact@v4
        with:
          name: freemc-${{ matrix.os }}
          path: dist/freemc.jar
