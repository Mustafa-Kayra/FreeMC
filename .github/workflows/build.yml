name: build

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  jar:
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest, macos-latest ]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Derle (Linux / macOS)
        if: runner.os != 'Windows'
        run: |
          chmod +x build.sh package.sh
          ./build.sh
          ./package.sh
      - name: Derle (Windows)
        if: runner.os == 'Windows'
        run: |
          .\build.bat
          .\package.bat
      - uses: actions/upload-artifact@v4
        with:
          name: freemc-${{ matrix.os }}
          path: |
            dist/freemc.jar
            dist/package/**
